# Stellar DeFi Vault - Mainnet Configuration (Example)
# Copy to mainnet.toml and fill in production values.
# NEVER commit real private keys or secrets.

[network]
name = "mainnet"
rpc_url = "https://soroban-rpc.mainnet.stellar.gateway.fm"
horizon_url = "https://horizon.stellar.org"
network_passphrase = "Public Global Stellar Network ; September 2015"

[contract]
# Token contract address (USDC on mainnet)
token_address = ""

[vault]
# Fee parameters (in basis points, 1 = 0.01%)
management_fee_bps = 20        # 0.2% annual management fee
performance_fee_bps = 200      # 2% performance fee
withdrawal_fee_bps = 10        # 0.1% withdrawal fee

# Rate parameters (in basis points)
base_yield_rate_bps = 500      # 5% base yield
bonus_yield_rate_bps = 200     # 2% bonus yield

# Caps (in token smallest unit)
max_deposit_cap = 100000000000000  # 10,000,000 tokens
max_withdrawal_cap = 1000000000000  # 100,000 tokens per withdrawal
min_deposit_amount = 100000000      # 10 tokens minimum deposit

[admin]
# Admin addresses (first is primary admin)
admin_addresses = [
  "",  # Primary admin
  "",  # Secondary admin
]

# Keeper addresses (optional)
keeper_addresses = []

[security]
# Emergency pause threshold (number of admins required to pause)
pause_threshold = 2

# Max daily withdrawal limit
max_daily_withdrawal = 1000000000000  # 100,000 tokens
