[workspace]

[package]
name = "stellar-defi-vault"
version = "0.1.0"
edition = "2021"
authors = []
license = "MIT"
description = "A non-custodial DeFi yield vault built on Stellar using Soroban smart contracts"
repository = "https://github.com/YOUR_ORG/stellar-defi-vault"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]
vault-wasm = []

[dependencies]
soroban-sdk = { version = "=29.0.1" }

[dev-dependencies]
proptest = "1.6.0"
soroban-sdk = { version = "=29.0.1", features = ["testutils"] }

# Release profile for deployed Soroban contracts (issue #657).
#
# Soroban's VM traps on overflow, but a `wasm32-unknown-unknown` build compiled
# with `overflow-checks = false` turns the receiver's arithmetic into a trap
# at the wrong layer / with the wrong error, and can silently wrap in code
# paths that use `+`/`*` directly. Keep the checks on for every optimised
# build, including `lto = true` builds.
#
# `opt-level = "z"` keeps the Wasm under Soroban's size limits; `panic = "abort"`
# avoids unwinding machinery that cannot run inside the VM. Do not relax these
# settings without also updating `src/test_release_profile.rs`.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
